<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TodoList</title>
    <style>
      body {
        background-color: #edf0f5;
      }

      .wrap {
        width: 100%;
        max-width: 1400px;
        margin: 0 auto;
        padding-top: 50px;
      }

      h1 {
        text-align: center;
        font-size: 50px;
        font-weight: 600;
        margin-bottom: 130px;
      }

      .top-line {
        width: 85%;
        height: 3px;
        background-color: #d7dfeb;
        margin: 0 auto 35px;
      }

      .input-box {
        width: 66%;
        margin: 0 auto 40px;
      }

      #studyInput {
        width: 100%;
        height: 65px;
        border: 2px solid;
        background-color: #fff;
        padding: 0 24px;
        font-size: 24px;
        outline: none;
        box-sizing: border-box;
      }

      #studyInput::placeholder {
        color: #d7dce5;
        font-style: italic;
        font-weight: 500;
      }

      .board {
        width: 80%;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
      }

      .column {
        width: 45%;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .title {
        text-align: center;
        font-size: 28px;
        font-weight: 800;
        margin-bottom: 55px;
      }

      .title span {
        display: inline-block;
        border-bottom: 4px solid #d7dfeb;
        padding-bottom: 8px;
      }

      .list {
        list-style: none;
        width: 100%;
        padding: 0;
        margin: 0;
      }

      .item {
        width: 100%;
        padding: 16px 0 18px;
        border-bottom: 6px solid #d7dfeb;
        margin-bottom: 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        box-sizing: border-box;
      }

      .text {
        font-size: 28px;
        font-weight: 700;
      }

      .btn {
        border: none;
        background-color: #d9dfeb;
        font-size: 18px;
        padding: 7px 12px;
        cursor: pointer;
        flex-shrink: 0;
      }

      .btn:hover {
        background-color: #c8d1df;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>UMC Study Plan</h1>

      <div class="top-line"></div>

      <div class="input-box">
        <input
          type="text"
          id="studyInput"
          placeholder="스터디 계획을 작성해보세요!"
        />
      </div>

      <div class="board">
        <section class="column">
          <div class="title"><span>해야 할 일</span></div>
          <ul class="list" id="todoList"></ul>
        </section>

        <section class="column">
          <div class="title"><span>해낸 일</span></div>
          <ul class="list" id="doneList"></ul>
        </section>
      </div>
    </div>

    <script>
      const studyInput = document.getElementById("studyInput");
      const todoList = document.getElementById("todoList");
      const doneList = document.getElementById("doneList");

      function makeItem(textValue, btnLabel, onClickHandler) {
        const li = document.createElement("li");
        li.className = "item";

        const span = document.createElement("span");
        span.className = "text";
        span.innerText = textValue;

        const button = document.createElement("button");
        button.className = "btn";
        button.innerText = btnLabel;
        button.onclick = onClickHandler;

        li.appendChild(span);
        li.appendChild(button);

        return li;
      }

      function addTodo(textValue) {
        const li = makeItem(textValue, "완료", () => {
          li.remove();
          completeTodo(textValue);
        });
        todoList.appendChild(li);
      }

      function completeTodo(textValue) {
        const li = makeItem(textValue, "삭제", () => {
          li.remove();
        });
        doneList.appendChild(li);
      }

      function addTask() {
        const value = studyInput.value.trim();
        if (value === "") return;

        addTodo(value);
        studyInput.value = "";
      }

      studyInput.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          addTask();
        }
      });
    </script>
  </body>
</html>
