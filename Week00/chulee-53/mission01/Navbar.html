<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navbar</title>

    <style>
      body {
        margin: 0;
        background: #f2f2f2;
        font-family: Arial, Helvetica, sans-serif;
      }

      /* Block */

      .navbar {
        width: 92%;
        margin: 30px auto;
        background: #fff;
        border: 4px solid #2f2f2f;
        border-radius: 30px;
        padding: 12px 22px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 10px 0 #2f2f2f;
      }

      /* logo */

      .navbar__logo {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .navbar__logo-icon {
        width: 46px;
        height: 46px;
        background: #ff6a3d;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
      }

      .navbar__logo-text {
        font-size: 24px;
        font-weight: 700;
      }

      /* right group */

      .navbar__right {
        display: flex;
        align-items: center;
        gap: 40px;
      }

      /* menu */

      .navbar__menu {
        display: flex;
        gap: 30px;
      }

      .navbar__menu-item {
        text-decoration: none;
        font-size: 18px;
        font-weight: 600;
        color: #777;
        transition: all 0.15s ease;
      }

      .navbar__menu-item:hover {
        color: #ff6a3d;
      }

      .navbar__menu-item--highlight {
        color: #ff6a3d;
      }

      .navbar__menu-item--highlight:hover {
        transform: scale(1.1);
      }

      /* language */

      .navbar__lang {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 3px solid #2f2f2f;
        border-radius: 40px;
        padding: 6px 10px;
      }

      .navbar__lang-title {
        color: #777;
        font-size: 14px;
      }

      .navbar__lang-btn {
        padding: 6px 14px;
        border-radius: 20px;
        border: 2px solid #2f2f2f;
        font-weight: 700;
        font-size: 14px;
        background: transparent;
        cursor: pointer;
      }

      .navbar__lang-btn--active {
        background: #ff6a3d;
        color: #fff;
      }

      /* responsive */

      @media (max-width: 700px) {
        .navbar__menu {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <nav class="navbar">
      <div class="navbar__logo">
        <div class="navbar__logo-icon">🐱</div>
        <div class="navbar__logo-text">Aido</div>
      </div>

      <div class="navbar__right">
        <div class="navbar__menu">
          <a class="navbar__menu-item" id="menuCats" href="#friends"
            >고양이 친구들</a
          >
          <a
            class="navbar__menu-item navbar__menu-item--highlight"
            id="menuAlarm"
            href="#download"
            >앱 다운로드</a
          >
        </div>

        <div class="navbar__lang">
          <span class="navbar__lang-title" id="langTitle">언어</span>
          <button
            type="button"
            class="navbar__lang-btn navbar__lang-btn--active"
            id="btnKO"
            aria-pressed="true"
          >
            KO
          </button>
          <button
            type="button"
            class="navbar__lang-btn"
            id="btnEN"
            aria-pressed="false"
          >
            EN
          </button>
        </div>
      </div>
    </nav>

    <script>
      const koBtn = document.getElementById("btnKO");
      const enBtn = document.getElementById("btnEN");

      const menuCats = document.getElementById("menuCats");
      const menuAlarm = document.getElementById("menuAlarm");
      const langTitle = document.getElementById("langTitle");

      koBtn.addEventListener("click", () => {
        koBtn.classList.add("navbar__lang-btn--active");
        enBtn.classList.remove("navbar__lang-btn--active");
        koBtn.setAttribute("aria-pressed", "true");
        enBtn.setAttribute("aria-pressed", "false");

        menuCats.textContent = "고양이 친구들";
        menuAlarm.textContent = "앱 다운로드";
        langTitle.textContent = "언어";
      });

      enBtn.addEventListener("click", () => {
        enBtn.classList.add("navbar__lang-btn--active");
        koBtn.classList.remove("navbar__lang-btn--active");
        enBtn.setAttribute("aria-pressed", "true");
        koBtn.setAttribute("aria-pressed", "false");

        menuCats.textContent = "Cat Friends";
        menuAlarm.textContent = "Download App";
        langTitle.textContent = "LANGUAGE";
      });
    </script>
  </body>
</html>
