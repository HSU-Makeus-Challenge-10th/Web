<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />

    <style>
      body {
        margin: 0;
        background: #f2f2f2;
        font-family: Arial, Helvetica, sans-serif;
      }

      .navbar {
        width: 92%;
        margin: 30px auto;
        background: #fff;
        border: 4px solid #2f2f2f;
        border-radius: 40px;
        padding: 12px 22px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 10px 0 #2f2f2f;
      }

      /* 왼쪽 로고 영역 */

      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .logo-icon {
        width: 46px;
        height: 46px;
        background: #ff6a3d;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
      }

      .logo-text {
        font-size: 24px;
        font-weight: 700;
      }

      .right-group {
        display: flex;
        align-items: center;
        gap: 40px;
      }

      .menu {
        display: flex;
        gap: 30px;
      }

      .menu a {
        text-decoration: none;
        font-size: 18px;
        font-weight: 600;
        color: #777;
      }

      .menu a.highlight {
        color: #ff6a3d;
      }

      /* 언어 토글 */

      .lang-box {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 3px solid #2f2f2f;
        border-radius: 40px;
        padding: 6px 10px;
      }

      .lang-title {
        color: #777;
        font-size: 14px;
      }

      .lang-btn {
        padding: 6px 14px;
        border-radius: 20px;
        border: 2px solid #2f2f2f;
        font-weight: 700;
        font-size: 14px;
        background-color: #fff;
      }

      .lang-btn.active {
        background: #ff6a3d;
        color: #fff;
      }

      /* 화면 좁아지면 메뉴 숨김 */

      @media (max-width: 700px) {
        .menu {
          display: none;
        }

        .logo-text {
          font-size: 20px;
        }
      }
    </style>
  </head>

  <body>
    <nav class="navbar">
      <div class="logo">
        <div class="logo-icon">🐱</div>
        <div class="logo-text">Aido</div>
      </div>

      <div class="right-group">
        <div class="menu">
          <a href="#">고양이 친구들</a>
          <a class="highlight" href="#">출시 알람 받기</a>
        </div>

        <div class="lang-box">
          <span class="lang-title">언어</span>
          <button class="lang-btn active">KO</button>
          <button class="lang-btn">EN</button>
        </div>
      </div>
    </nav>
    <script id="8a6om3">
      const buttons = document.querySelectorAll(".lang-btn");

      buttons.forEach((btn) => {
        btn.addEventListener("click", () => {
          buttons.forEach((b) => b.classList.remove("active"));

          btn.classList.add("active");
        });
      });
    </script>
  </body>
</html>
