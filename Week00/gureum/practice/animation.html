<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>튕기는 원</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .ball {
      width: 100px;
      height: 100px;
      background-color: purple;
      border-radius: 50%;
      animation: bounce 0.8s ease-in-out infinite alternate;
    }

    @keyframes bounce {
      from {
        transform: translateY(0) scaleX(1.2) scaleY(0.8);
      }
      to {
        transform: translateY(-200px) scaleX(1) scaleY(1);
      }
    }
  </style>
</head>
<body>
  <div class="ball"></div>
</body>
</html>
