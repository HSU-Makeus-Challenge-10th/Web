<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition Practice</title>
    <style>
        .box {
            margin: 50px;
            width: 100px;
            height: 100px;
            transform: rotate(45deg) translate(100px, 50px);
            background-color: red;
            transition: all 1s;

        }

        .box:hover {
            background-color: purple;
        }
    </style>
</head>

<body>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
</body>

</html>
