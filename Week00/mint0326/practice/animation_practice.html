<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation Practice</title>
</head>

<body>
    <div class="stage">
        <div class="ball"></div>
    </div>

    <style>
        .ball {
            width: 50px;
            height: 50px;
            background: red;
            border-radius: 50%;
            position: absolute;
            bottom: 0;
            left: 50px;

            animation: bounce 0.6s ease-in infinite alternate;
        }

        /* 공이 튀어오르는 효과 */
        @keyframes bounce {
            from {
                transform: translateY(0) scaleY(0.8);
            }

            to {
                transform: translateY(-200px) scaleY(1);
            }
        }

        :hover .ball {
            animation-play-state: paused;
        }
    </style>
</body>

</html>
