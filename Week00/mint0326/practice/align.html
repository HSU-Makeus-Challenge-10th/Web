<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1 {
            width: 100%;
            background-color: red;
            text-align: center;
        }

        .box2 {
            width: 100%;
            background-color: yellow;
            margin: 0 auto;
            text-align: center;
        }

        .box3 {
            width: 100%;
            background-color: green;
            display: flex;
            justify-content: center;
            align-items: center;
            align-content: center;

        }

        .box4 {
            width: 100%;
            background-color: blue;
            color: white;
            transform: translate(0%, 0%);
            text-align: center;
        }

        .box5 {
            width: 100%;
            background-color: purple;
            display: grid;
            justify-content: center;
            align-content: center;
            place-content: center;
            justify-items: center;
            align-items: center;
            place-items: center;
        }
    </style>
</head>

<body>
    <div class="box1">text_align</div>
    <div class="box2">margin</div>
    <div class="box3">flex</div>
    <div class="box4">transform</div>
    <div class="box5">grid</div>

</body>

</html>
