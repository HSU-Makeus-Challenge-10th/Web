<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>background-image</title>
    <style>
        p {
            height: 300px;
            background-image: url('https://cdn-icons-png.flaticon.com/256/4213/4213636.png');
            background-repeat: repeat-y;
            background-position: top center;
            background-size: auto;
        }

        div {
            height: 300px;
            background: red url("https://cdn-icons-png.flaticon.com/256/4213/4213636.png") repeat-x top center / auto
        }
    </style>
</head>

<body>
    <p>이 사진의 배경 이미지</p>
    <div>축약형 확인</div>

</body>

</html>
