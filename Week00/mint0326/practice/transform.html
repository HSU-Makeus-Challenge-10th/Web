<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>transform</title>
    <style>
      .box {
        padding: 10px;
        width: 100px;
        height: 100px;
        background-color: red;
      }

      .box:hover {
        transform: translate(100px, 100px) scale(1.2) rotate(45deg)
          skew(20deg, 20deg);
      }
    </style>
  </head>

  <body>
    <div class="box">transform</div>
  </body>
</html>
