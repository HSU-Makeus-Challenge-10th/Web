<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline-Block Practice</title>
    <style>
        p {
            display: block;
            color: purple;
        }

        span {
            display: inline-block;
            color: red;
            font-weight: bold;
            border: 1px solid red;
            background-color: yellow;
            width: 200px;
        }

        a {
            display: inline;
            color: blue;
            width: 200px;
        }
    </style>
</head>

<body>
    <h1>block, inline, inline-block 차이점</h1>
    <h3>block</h3>
    <p>이것은 블럭 태그인 &lt;p&gt;입니다.</p>
    <hr>
    <h3>inline</h3>
    <a>이것은 인라인 태그인 &lt;a&gt;입니다.</a>
    <hr>
    <h3>inline-block</h3>
    <span>이것은 인라인 블럭 태그인 &lt;span&gt;입니다.</span>
    <a> 이 문장은 &lt;a&gt;로 감싸고 <span>&lt;span&gt;</span>로 강조하였습니다.</a>
    <a> 이 문장은 &lt;a&gt;로 감싸고 <p>&lt;p&gt;</p>로 강조하였습니다.</a>
    <p> 이 문장은 &lt;p&gt;로 감싸고 <a>&lt;a&gt;</a>로 강조하였습니다.</p>
    a태그에서도 width 속성을 적용해봤으나 적용되지 않았습니다.



</body>

</html>
