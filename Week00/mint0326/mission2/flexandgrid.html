<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>using flex and grid</title>
    <style>
        /* 기본 스타일 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body {
            text-align: center;
            font-weight: bold;
            font-size: 2rem;
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header-nav {
            display: flex;
            height: 100px;
        }

        .header-nav__item {
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .header-nav__header {
            flex: 1;
            background-color: navy;
        }

        .header-nav__menu {
            flex: 3;
            background-color: orangered;
        }

        .hero {
            height: 300px;
            background-color: skyblue;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .content-area {
            display: flex;
            justify-content: space-between;
            padding: 0;
            height: 400px;
            background-color: white;
        }

        .content-area__main {
            width: 50%;
            background-color: darkblue;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .content-area__side {
            width: 25%;
            display: grid;
            grid-template-rows: 1fr 1fr;
        }

        .side-item {
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
        }

        .side-item__image {
            background-color: lightcyan;
        }

        .side-item__extra {
            background-color: lightgreen;
        }

        /* 배너 영역 */
        .banner {
            height: 120px;
            background-color: lightgoldenrodyellow;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <header class="header-nav">
            <div class="header-nav__item header-nav__header">HEADER</div>
            <div class="header-nav__item header-nav__menu">MENU</div>
        </header>

        <section class="hero">HERO</section>

        <main class="content-area">
            <div class="content-area__main">MAIN</div>
            <aside class="content-area__side">
                <div class="side-item side-item__image">IMAGE</div>
                <div class="side-item side-item__extra">EXTRA</div>
            </aside>
        </main>

        <footer class="banner">BANNER</footer>
    </div>

</body>

</html>
