<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aido</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #f5f0e8;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 40px 20px;
    }

    .navbar {
      display: flex;
      align-items: center;
      background-color: #f5f0e8;
      border: 2.5px solid #2b2b2b;
      border-radius: 50px;
      padding: 10px 22px;
      max-width: 780px;
      margin: 0 auto;
      box-shadow: 4px 4px 0px #2b2b2b;
      gap: 16px;
    }

    .navbar__logo {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .navbar__logo-icon {
      width: 38px;
      height: 38px;
      background-color: #e8573a;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .navbar__logo-text {
      font-size: 20px;
      font-weight: 700;
      color: #2b2b2b;
    }

    .navbar__menu {
      display: flex;
      align-items: center;
      gap: 28px;
      margin-left: auto;
    }

    .navbar__menu-item {
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      color: #555;
      white-space: nowrap;
    }

    .navbar__menu-item--highlight {
      color: #e8573a;
      font-weight: 700;
    }

    /* BEM: navbar__lang */
    .navbar__lang {
      display: flex;
      align-items: center;
      border: 2px solid #2b2b2b;
      border-radius: 50px;
      padding: 4px 6px;
      gap: 2px;
      flex-shrink: 0;
    }

    .navbar__lang-label {
      font-size: 10px;
      font-weight: 600;
      color: #888;
      padding: 0 8px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .navbar__lang-btn {
      font-size: 12px;
      font-weight: 700;
      padding: 5px 12px;
      border: none;
      cursor: pointer;
      background: transparent;
      color: #888;
      border-radius: 50px;
      transition: background 0.2s, color 0.2s;
    }

    .navbar__lang-btn--active {
      background-color: #e8573a;
      color: white;
    }
    @media (max-width: 560px) {
      .navbar__menu {
        display: none;
      }
      .navbar__lang-label {
        display: none;
      }
    }

    @media (max-width: 700px) {
      .navbar__menu-item:not(.navbar__menu-item--highlight) {
        display: none;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <!-- 로고 -->
    <div class="navbar__logo">
      <div class="navbar__logo-icon">🐱</div>
      <span class="navbar__logo-text">Aido</span>
    </div>

    <nav class="navbar__menu">
      <a href="#" class="navbar__menu-item" data-en="Cat Friends" data-ko="고양이 친구들">Cat Friends</a>
      <a href="#" class="navbar__menu-item" data-en="Patch Notes" data-ko="패치 노트">Patch Notes</a>
      <a href="#" class="navbar__menu-item navbar__menu-item--highlight" data-en="Download App" data-ko="앱 다운로드">Download App</a>
    </nav>

    <div class="navbar__lang">
      <span class="navbar__lang-label" data-en="Language" data-ko="언어">Language</span>
      <button class="navbar__lang-btn" id="btn-ko" onclick="setLang('ko')">KO</button>
      <button class="navbar__lang-btn navbar__lang-btn--active" id="btn-en" onclick="setLang('en')">EN</button>
    </div>
  </nav>

  <script>
    function setLang(lang) {
      document.querySelectorAll('[data-' + lang + ']').forEach(el => {
        el.textContent = el.getAttribute('data-' + lang);
      });

      const btnKo = document.getElementById('btn-ko');
      const btnEn = document.getElementById('btn-en');

      if (lang === 'ko') {
        btnKo.classList.add('navbar__lang-btn--active');
        btnEn.classList.remove('navbar__lang-btn--active');
        document.documentElement.lang = 'ko';
        // 경로 변경 (/ko)
        history.pushState(null, '', '/ko');
      } else {
        btnEn.classList.add('navbar__lang-btn--active');
        btnKo.classList.remove('navbar__lang-btn--active');
        document.documentElement.lang = 'en';
        // 경로 변경 (/en)
        history.pushState(null, '', '/en');
      }
    }
    (function() {
      const path = window.location.pathname;
      if (path.startsWith('/ko')) {
        setLang('ko');
      } else {
        setLang('en');
      }
    })();
  </script>

</body>
</html>
