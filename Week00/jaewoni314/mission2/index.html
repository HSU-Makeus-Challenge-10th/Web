<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layout Practice</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family: Arial, sans-serif;
}

.top{
  display:flex;
}

.header{
  background:#0f1d3a;
  color:white;
  flex:1;
  padding:30px;
  text-align:center;
  font-size:28px;
}

.menu{
  background:#ef3b44;
  color:white;
  flex:2;
  padding:30px;
  text-align:center;
  font-size:28px;
}

/* HERO */
.hero{
  background:#5a84b6;
  height:300px;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  font-size:40px;
}

.content{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  height:350px;
}

.main{
  background:#2c3f5c;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:32px;
}

.blank{
  background:#e5e5e5;
}

.side{
  display:grid;
  grid-template-rows:1fr 1fr;
}

.image{
  background:#a8c4c7;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:24px;
}

.extra{
  background:#4fb08d;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:24px;
}

.banner{
  background:#efc76b;
  height:120px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:28px;
}

</style>
</head>

<body>

<div class="top">
  <div class="header">HEADER</div>
  <div class="menu">MENU</div>
</div>

<div class="hero">HERO</div>

<div class="content">
  <div class="main">MAIN</div>
  <div class="blank"></div>

  <div class="side">
    <div class="image">IMAGE</div>
    <div class="extra">EXTRA</div>
  </div>
</div>

<div class="banner">BANNER</div>

</body>
</html>
