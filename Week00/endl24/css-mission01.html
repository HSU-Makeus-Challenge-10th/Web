<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      .lang-state {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      body {
        font-family:
          "Pretendard",
          -apple-system,
          sans-serif;
        background-color: #f5f5f5;
        padding: 40px 20px;
        margin: 0;
      }

      .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: white;
        padding: 12px 30px;
        border: 3px solid #1a1a1a;
        border-radius: 50px;
        box-shadow: 0 6px 0 #1a1a1a;
        max-width: 1000px;
        margin: 0 auto;
        transition: all 0.2s ease;
      }

      .navbar__logo {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 24px;
        font-weight: 800;
        color: #1a1a1a;
        cursor: pointer;
        text-decoration: none;
      }

      .navbar__icon {
        background-color: #ff6b4a;
        border-radius: 12px;
        padding: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid #1a1a1a;
      }

      .navbar__right {
        display: flex;
        align-items: center;
        gap: 35px;
      }

      .navbar__menu {
        list-style: none;
        display: flex;
        gap: 25px;
        margin: 0;
        padding: 0;
      }

      .navbar__link {
        text-decoration: none;
        color: #666;
        font-weight: 600;
        font-size: 15px;
        transition: color 0.2s;
      }

      .navbar__link:hover {
        color: #1a1a1a;
      }

      .navbar__link--highlight {
        color: #ff6b4a;
      }
      .navbar__link--highlight:active {
        transform: translateY(2px);
      }

      .navbar__lang-toggle {
        display: flex;
        align-items: center;
        gap: 12px;
        border: 2px solid #1a1a1a;
        border-radius: 30px;
        padding: 4px 6px;
        background-color: #fff;
      }

      .navbar__lang-label {
        color: #bbb;
        font-size: 13px;
        font-weight: 700;
        margin-left: 8px;
        user-select: none;
      }

      .navbar__lang-group {
        display: flex;
        gap: 4px;
      }

      .navbar__lang-btn {
        padding: 4px 14px;
        border-radius: 20px;
        cursor: pointer;
        font-weight: 800;
        font-size: 13px;
        color: #888;
        border: 1px solid transparent;
        transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        user-select: none;
      }

      #lang-ko:checked ~ .navbar .navbar__lang-btn--ko,
      #lang-en:checked ~ .navbar .navbar__lang-btn--en {
        background-color: #ff6b4a;
        color: white;
        border: 1px solid #1a1a1a;
        box-shadow: 0 3px 0 #1a1a1a;
        transform: translateY(-2px);
      }

      .navbar__lang-btn:active {
        transform: translateY(2px) !important;
        box-shadow: 0 0 0 #1a1a1a !important;
      }

      @media (max-width: 768px) {
        .navbar__item:nth-child(1),
        .navbar__item:nth-child(2) {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <input type="radio" name="lang" id="lang-ko" class="lang-state" checked />
    <input type="radio" name="lang" id="lang-en" class="lang-state" />

    <nav class="navbar">
      <a href="/" class="navbar__logo">
        <div class="navbar__icon">
          <img
            src="https://api.iconify.design/twemoji:cat-face.svg"
            width="24"
            height="24"
            alt="logo"
          />
        </div>
        <span class="navbar__logo-text">Aido</span>
      </a>

      <div class="navbar__right">
        <ul class="navbar__menu">
          <li class="navbar__item">
            <a href="#" class="navbar__link">고양이 친구들</a>
          </li>
          <li class="navbar__item">
            <a href="#" class="navbar__link">패치 노트</a>
          </li>
          <li class="navbar__item">
            <a href="#" class="navbar__link navbar__link--highlight"
              >앱 다운로드</a
            >
          </li>
        </ul>

        <div class="navbar__lang-toggle">
          <span class="navbar__lang-label">언어</span>
          <div class="navbar__lang-group">
            <label for="lang-ko" class="navbar__lang-btn navbar__lang-btn--ko"
              >KO</label
            >
            <label for="lang-en" class="navbar__lang-btn navbar__lang-btn--en"
              >EN</label
            >
          </div>
        </div>
      </div>
    </nav>
  </body>
</html>
